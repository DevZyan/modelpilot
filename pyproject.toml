[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelpilot"
version = "0.1.0"
description = "Profile a dataset, detect its patterns, and get told which model will perform best — with reasons."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nayan Pal" }]
keywords = ["machine-learning", "eda", "automl", "model-selection", "data-profiling", "scikit-learn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
boost = ["xgboost>=1.6", "lightgbm>=3.3"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/DevZyan/modelpilot"
Repository = "https://github.com/DevZyan/modelpilot"
Issues = "https://github.com/DevZyan/modelpilot/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/modelpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
